name = "projector-wall"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Custom domain for the API. Requires sohan.website's DNS to be on Cloudflare
# (see projector/docs/setup.md). Until then, comment this out and use the
# *.workers.dev URL with ?api=<url> on the editor/display pages.
routes = [{ pattern = "projector-api.sohan.website", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://sohan.website,https://www.sohan.website,http://localhost:3000"
# Where this API is reachable; Spotify redirects back to API_ORIGIN/api/spotify/callback.
API_ORIGIN = "https://projector-api.sohan.website"

# Workers AI: Jarvis's free brain (open models) and voice (text-to-speech).
# Free allowance: 10,000 neurons a day, shared across models.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "WALL"
class_name = "Wall"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Wall"]

# Secrets (set with `npx wrangler secret put NAME`, or .dev.vars locally):
#   EDITOR_PASSWORD, SESSION_SECRET, DISPLAY_KEY
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET (see projector/docs/spotify.md)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (see projector/docs/google.md)
#   ANTHROPIC_API_KEY (optional, only for Jarvis on Claude; see projector/docs/jarvis.md)
